allowBuilds:
  # installs the platform binary (orval, vite)
  esbuild: true
  # picks the Vue 3 build (pinia)
  vue-demi: true

overrides:
  # laravel-mix 6 breaks on newer webpack (also pinned as a direct dev dependency)
  webpack: ~5.105.4
  # orval's @scalar/json-magic pins undici 7.29.0, which has advisories (fixed in 7.29.1)
  undici: ^7.29.1
